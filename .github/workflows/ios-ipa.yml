name: Cat Clock for iPhone (unsigned package)

# Builds the real Cat Clock app on a cloud Mac and saves an UNSIGNED .ipa.
# AltStore signs it with your own Apple ID when you install it, so no keys or
# passwords are stored anywhere in this repository.
on:
  workflow_dispatch:
  push:
    branches:
      - main
      - phase-7/iphone
    paths:
      - "lib/**"
      - "ios/**"
      - "assets/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - ".github/workflows/ios-ipa.yml"

jobs:
  build:
    runs-on: macos-26
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Show the toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.9"
          channel: stable
          cache: true

      - name: Show the Flutter version
        run: flutter --version

      - name: Get the packages
        run: flutter pub get

      - name: Build without signing
        shell: bash
        run: |
          flutter build ios --release --no-codesign 2>&1 | tee build.log

      - name: Report build errors
        if: failure()
        shell: bash
        run: |
          # Copy the first errors into the run's annotations, which can be read
          # without signing in to GitHub.
          grep -iE "error|failed|exception|not supported" build.log | sort -u | head -12 | sed 's/%/%25/g' | while IFS= read -r line; do
            echo "::error title=flutter build::${line}"
          done
          tail -n 40 build.log | sed 's/%/%25/g' | tr '\n' '|' > tail.txt
          echo "::notice title=End of build log::$(cat tail.txt)"

      - name: Add the alarm sounds where the iPhone's alarm service can find them
        shell: bash
        run: |
          # AlarmKit plays sound files from the top of the app itself, not from
          # Flutter's own asset folder, so every sound at every loudness goes there.
          count=$(ls assets/sounds/*.wav | wc -l | tr -d ' ')
          echo "Found $count sound files"
          test "$count" -eq 30
          cp assets/sounds/*.wav build/ios/iphoneos/Runner.app/

      - name: Package the .ipa
        shell: bash
        run: |
          rm -rf Payload CatClock.ipa
          mkdir Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qr CatClock.ipa Payload
          ls -l CatClock.ipa

      - name: Report what is inside the package
        shell: bash
        run: |
          # Written as a notice so it can be read without signing in to GitHub.
          sounds=$(unzip -l CatClock.ipa | grep -c "Runner.app/.*\.wav" || true)
          size=$(ls -l CatClock.ipa | awk '{print $5}')
          keys=$(plutil -p Payload/Runner.app/Info.plist | grep -E "NSAlarmKit|MinimumOSVersion|CFBundleIdentifier|CFBundleDisplayName|NSSupportsLiveActivities|NSLocation" | tr -s ' ' | tr '\n' '|')
          echo "::notice title=Package contents::${sounds} sound files, ${size} bytes"
          echo "::notice title=Info.plist keys::${keys}"

      - name: Save the package for download
        uses: actions/upload-artifact@v4
        with:
          name: CatClock-unsigned-ipa
          path: CatClock.ipa
          retention-days: 14
